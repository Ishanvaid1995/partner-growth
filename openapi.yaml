openapi: 3.0.3
info:
  title: Partner Growth Copilot API
  description: >-
    Secured REST API providing agentic AI tools for IBM partner pre-sales automation, solution proposal generation, follow-up email drafting, internal technical handoffs, and CRM opportunity management using IBM watsonx.ai. Supports x-api-key authentication for watsonx Orchestrate.
  version: 1.0.0
servers:
  - url: https://partner-growth.2csujuhkf3ha.ca-tor.codeengine.appdomain.cloud
    description: IBM Cloud Code Engine Production Server
security:
  - ApiKeyAuth: []
  - LegacyPgcKey: []
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Check Service Health
      description: Returns the operational status of the Partner Growth Copilot service. Use this tool to verify system availability before starting workflows.
      operationId: health_check
      security: []
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: partner-growth-copilot

  /generate-proposal:
    post:
      summary: Generate IBM Solution Proposal
      description: >-
        Analyzes customer requirements and deal context to generate an IBM-centric solution proposal, including recommended IBM stack, architecture summary, and key business outcomes.
      operationId: generate_proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                  description: Raw customer requirements, industry, use case, budget, and timeline details.
                  example: "Customer: Acme Retail; Industry: retail; Use case: AI analytics; Budget: 100k; Timeline: Q4."
      responses:
        '200':
          description: Solution proposal generated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - proposal
                  - solution_name
                  - recommended_ibm_stack
                  - business_outcomes
                properties:
                  proposal:
                    type: string
                  solution_name:
                    type: string
                  recommended_ibm_stack:
                    type: array
                    items:
                      type: string
                  business_outcomes:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request parameters or input too long
        '401':
          description: Unauthorized - Invalid or missing x-api-key header
        '500':
          description: Internal server error generating proposal

  /draft-followup-email:
    post:
      summary: Draft Customer Follow-Up Email
      description: >-
        Drafts a professional, executive-ready customer follow-up email based on customer deal context and proposed solution details.
      operationId: draft_followup_email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                proposal:
                  type: string
      responses:
        '200':
          description: Customer follow-up email drafted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - subject
                  - email_body
                properties:
                  subject:
                    type: string
                  email_body:
                    type: string
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - Invalid or missing x-api-key header

  /create-handoff-summary:
    post:
      summary: Create Internal Technical Handoff Summary
      description: >-
        Generates an internal technical handoff summary for engineering and delivery teams, including scope, action items, and implementation risks.
      operationId: create_handoff_summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                proposal:
                  type: string
      responses:
        '200':
          description: Technical handoff summary created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - next_steps
                  - risks
                properties:
                  summary:
                    type: string
                  next_steps:
                    type: array
                    items:
                      type: string
                  risks:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - Invalid or missing x-api-key header

  /create-opportunity-stub:
    post:
      summary: Create CRM Opportunity Stub
      description: >-
        Extracts structured sales deal parameters and creates a CRM opportunity payload ready for Salesforce, HubSpot, or internal CRM ingestion.
      operationId: create_opportunity_stub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                proposal:
                  type: string
                customer_name:
                  type: string
      responses:
        '200':
          description: CRM opportunity payload created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - opportunity_name
                  - account_name
                  - stage
                  - notes
                  - estimated_value
                properties:
                  opportunity_name:
                    type: string
                  account_name:
                    type: string
                  stage:
                    type: string
                  notes:
                    type: string
                  estimated_value:
                    type: string
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - Invalid or missing x-api-key header

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Standard API key header preferred by IBM watsonx Orchestrate tool connections.
    LegacyPgcKey:
      type: apiKey
      in: header
      name: X-PGC-KEY
      description: Legacy custom API key header for backward compatibility.
    BearerAuth:
      type: http
      scheme: bearer
      description: Standard Authorization Bearer token header.
