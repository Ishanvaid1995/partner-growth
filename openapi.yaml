openapi: 3.0.3
info:
  title: Partner Growth Copilot API
  description: >-
    Secured REST API providing agentic AI tools for IBM partner pre-sales automation, solution proposal generation, follow-up email drafting, internal technical handoffs, and CRM opportunity management using IBM watsonx.ai.
  version: 1.0.0
servers:
  - url: https://partner-growth.2csujuhkf3ha.ca-tor.codeengine.appdomain.cloud
    description: IBM Cloud Code Engine Production Server
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Check Service Health
      description: Returns the operational status of the Partner Growth Copilot service. Use this tool to verify system availability before starting workflows.
      operationId: health_check
      security: []
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: partner-growth-copilot

  /generate-proposal:
    post:
      summary: Generate IBM Solution Proposal
      description: >-
        Analyzes customer requirements and deal context to generate an IBM-centric solution proposal, including recommended IBM stack, architecture summary, and key business outcomes. Use this tool when the user requests an IBM solution proposal or technical blueprint for a deal.
      operationId: generate_proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                  description: Raw customer requirements, industry, use case, budget, and timeline details.
                  example: "Customer: Acme Retail; Industry: retail; Use case: AI analytics; Budget: 100k; Timeline: Q4."
      responses:
        '200':
          description: Solution proposal generated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - proposal
                  - solution_name
                  - recommended_ibm_stack
                  - business_outcomes
                properties:
                  proposal:
                    type: string
                    description: Multi-paragraph structured IBM solution proposal text.
                  solution_name:
                    type: string
                    description: Title of the recommended IBM solution.
                  recommended_ibm_stack:
                    type: array
                    items:
                      type: string
                    description: List of recommended IBM products and services.
                  business_outcomes:
                    type: array
                    items:
                      type: string
                    description: Key expected business metrics and value drivers.
        '400':
          description: Invalid request parameters or input too long
        '401':
          description: Unauthorized - Invalid or missing X-PGC-KEY header
        '500':
          description: Internal server error generating proposal

  /draft-followup-email:
    post:
      summary: Draft Customer Follow-Up Email
      description: >-
        Drafts a professional, executive-ready customer follow-up email based on customer deal context and proposed solution details. Use this tool when the user asks to send, draft, or compose a follow-up email for a customer deal.
      operationId: draft_followup_email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                  description: Customer deal requirements or summary context.
                proposal:
                  type: string
                  description: Optional generated proposal text to reference in the email body.
      responses:
        '200':
          description: Customer follow-up email drafted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - subject
                  - email_body
                properties:
                  subject:
                    type: string
                    description: Email subject line.
                  email_body:
                    type: string
                    description: Formatted executive email text.
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - Invalid or missing X-PGC-KEY header

  /create-handoff-summary:
    post:
      summary: Create Internal Technical Handoff Summary
      description: >-
        Generates an internal technical handoff summary for engineering and delivery teams, including scope, action items, and implementation risks. Use this tool when preparing an internal project handoff, architecture review, or technical delivery plan.
      operationId: create_handoff_summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                  description: Customer deal context and requirements.
                proposal:
                  type: string
                  description: Optional generated proposal details.
      responses:
        '200':
          description: Technical handoff summary created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - next_steps
                  - risks
                properties:
                  summary:
                    type: string
                    description: Technical scope and implementation summary.
                  next_steps:
                    type: array
                    items:
                      type: string
                    description: Recommended technical action items.
                  risks:
                    type: array
                    items:
                      type: string
                    description: Technical implementation risks or considerations.
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - Invalid or missing X-PGC-KEY header

  /create-opportunity-stub:
    post:
      summary: Create CRM Opportunity Stub
      description: >-
        Extracts structured sales deal parameters and creates a CRM opportunity payload ready for Salesforce, HubSpot, or internal CRM ingestion. Use this tool when logging a deal in CRM, creating an opportunity record, or tracking pre-sales pipeline.
      operationId: create_opportunity_stub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_input
              properties:
                raw_input:
                  type: string
                  description: Customer deal context string.
                proposal:
                  type: string
                  description: Optional generated solution proposal details.
                customer_name:
                  type: string
                  description: Optional explicit customer account name.
      responses:
        '200':
          description: CRM opportunity payload created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - opportunity_name
                  - account_name
                  - stage
                  - notes
                  - estimated_value
                properties:
                  opportunity_name:
                    type: string
                    description: Formatted opportunity title.
                  account_name:
                    type: string
                    description: Customer account name.
                  stage:
                    type: string
                    example: Qualification
                    description: Pipeline deal stage.
                  notes:
                    type: string
                    description: Deal overview notes.
                  estimated_value:
                    type: string
                    description: Estimated deal size or budget value.
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - Invalid or missing X-PGC-KEY header

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-PGC-KEY
      description: Header-based API Key authentication matching PGC_API_KEY environment variable.
