<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM watsonx Orchestrate Embed Isolation Test</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #0f172a; color: #fff; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 12px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    #logBox { background: #000; font-family: monospace; font-size: 12px; padding: 14px; border-radius: 6px; color: #4ade80; margin-top: 16px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBM watsonx Orchestrate Embed Isolation Test</h1>
    <p>This standalone page isolates the IBM watsonx Orchestrate chat widget embed from main site CSS/JS to identify the exact cause of authentication or iframe initialization errors.</p>
    <div id="logBox">Initializing test harness...</div>
  </div>

  <script>
    function logMessage(msg) {
      console.log('[WXO Embed Test]', msg);
      const box = document.getElementById('logBox');
      if (box) box.textContent += '\n' + new Date().toLocaleTimeString() + ': ' + msg;
    }

    logMessage('Configuring window.wxOConfiguration...');
    window.wxOConfiguration = {
      orchestrationID: "94acdb45fcec4cfe9fa1f2b4f4b116bb_dcf235a5-27f4-4e1c-bfb1-65b3e1cf5d66",
      hostURL: "https://ca-tor.watson-orchestrate.cloud.ibm.com",
      rootElementID: "root",
      deploymentPlatform: "ibmcloud",
      crn: "crn:v1:bluemix:public:watsonx-orchestrate:ca-tor:a/94acdb45fcec4cfe9fa1f2b4f4b116bb:dcf235a5-27f4-4e1c-bfb1-65b3e1cf5d66::",
      chatOptions: {
        agentId: "255fce2b-bf14-4c1a-8b55-2633e1ecbbce", 
        agentEnvironmentId: "d6d7e725-8c1b-401f-8bf0-8ebe14c4afcd",
      }
    };

    setTimeout(function () {
      logMessage('Injecting wxoLoader.js script tag into document.head...');
      const script = document.createElement('script');
      script.src = `${window.wxOConfiguration.hostURL}/wxochat/wxoLoader.js?embed=true`;
      script.addEventListener('load', function () {
        logMessage('wxoLoader.js loaded successfully from IBM host. Calling wxoLoader.init()...');
        if (window.wxoLoader && typeof window.wxoLoader.init === 'function') {
          try {
            window.wxoLoader.init();
            logMessage('wxoLoader.init() executed cleanly.');
          } catch (e) {
            logMessage('wxoLoader.init() threw an exception: ' + e.message);
          }
        } else {
          logMessage('Warning: window.wxoLoader object not found after script load.');
        }
      });
      script.addEventListener('error', function (err) {
        logMessage('Error: Failed to load script from ' + script.src);
      });
      document.head.appendChild(script);
    }, 0);
  </script>
</body>
</html>
